<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XeroidShop | Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap');
        body { font-family: 'Google Sans', sans-serif; background: #F8F9FF; }
        .detail-card { background: #FFFFFF; border-radius: 40px 40px 0 0; box-shadow: 0 -10px 40px rgba(0,0,0,0.04); }
    </style>
</head>
<body class="pb-32">
    <button onclick="history.back()" class="fixed top-6 left-6 z-50 w-12 h-12 bg-white/80 backdrop-blur rounded-full shadow-lg flex items-center justify-center transition-all active:scale-90">
        <span class="material-symbols-rounded">arrow_back</span>
    </button>

    <div id="hero"></div>

    <script src="script.js"></script>
    <script>
        const pid = new URLSearchParams(window.location.search).get('id');
        async function loadDetail() {
            const res = await fetch('https://fakestoreapi.com/products');
            allProducts = await res.json();
            const p = allProducts.find(i => i.id == pid);

            document.getElementById('hero').innerHTML = `
                <div class="w-full h-[50vh] bg-white flex items-center justify-center p-12">
                    <img src="${p.image}" class="max-h-full object-contain">
                </div>
                <div class="detail-card -mt-10 relative p-8 min-h-[50vh]">
                    <div class="max-w-xl mx-auto">
                        <div class="flex justify-between items-start mb-6">
                            <span class="bg-[#D1E4FF] text-[#001D35] font-bold text-[10px] px-4 py-1.5 rounded-full uppercase tracking-widest">${p.category}</span>
                            <div class="flex items-center gap-1 bg-slate-50 px-3 py-1 rounded-full text-sm font-bold">
                                <span class="material-symbols-rounded text-yellow-500" style="font-variation-settings: 'FILL' 1">star</span>
                                ${p.rating.rate}
                            </div>
                        </div>
                        <h1 class="text-3xl font-bold text-[#1A1C1E] mb-4">${p.title}</h1>
                        <p class="text-slate-500 leading-relaxed text-lg mb-10">${p.description}</p>
                        
                        <div class="fixed bottom-0 left-0 right-0 p-6 bg-white/80 backdrop-blur-xl border-t border-slate-100 flex items-center justify-between z-50">
                            <span class="text-3xl font-bold text-[#1A1C1E]">$${p.price}</span>
                            <button onclick="actionCart(${p.id})" class="bg-[#0061A4] text-white px-10 py-4 rounded-3xl font-bold shadow-xl active:scale-95 transition-all">
                                Add to Cart
                            </button>
                        </div>
                    </div>
                </div>`;
        }
        loadDetail();
    </script>
</body>
</html>
