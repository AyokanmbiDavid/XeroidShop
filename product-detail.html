<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XeroidShop | Detail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
    <link rel="stylesheet" href="styles.css"/>
</head>
<body class="pb-32 bg-[#121316]">
    <div id="snackbar">
        <span class="material-symbols-rounded text-[#a8c7fa]" id="snackIcon">info</span>
        <span id="snackText" class="text-xs font-medium">Action performed</span>
    </div>

    <button onclick="history.back()" class="fixed top-5 left-5 z-50 w-10 h-10 bg-[#1e1f23]/90 backdrop-blur border border-white/10 rounded-full shadow-lg flex items-center justify-center text-white active:scale-90 transition-all">
        <span class="material-symbols-rounded">arrow_back</span>
    </button>

    <div id="hero"></div>

    <script src="script.js"></script>
    <script>
        const pid = new URLSearchParams(window.location.search).get('id');
        async function loadDetail() {
            const res = await fetch('https://fakestoreapi.com/products');
            allProducts = await res.json();
            const p = allProducts.find(i => i.id == pid);

            document.getElementById('hero').innerHTML = `
                <div class="w-full h-[42vh] bg-white flex items-center justify-center p-10 relative">
                    <img id="detail-img" src="${p.image}" class="max-h-full object-contain">
                </div>
                <div id="detail-card" class="bg-[#1e1f23] rounded-t-[36px] -mt-8 relative p-7 min-h-[58vh] border-t border-white/10">
                    <div class="max-w-md mx-auto">
                        <div class="flex justify-between items-center mb-4">
                            <span class="bg-[#28292e] text-[#a8c7fa] border border-white/5 font-medium text-[10px] px-3.5 py-1.5 rounded-full uppercase tracking-wider">${p.category}</span>
                            <div class="flex items-center gap-1 bg-[#28292e] px-3 py-1 rounded-full text-xs font-bold text-amber-300 border border-white/5">
                                <span class="material-symbols-rounded text-sm" style="font-variation-settings: 'FILL' 1">star</span>
                                ${p.rating.rate}
                            </div>
                        </div>
                        <h1 class="text-lg font-bold text-white mb-3 leading-snug">${p.title}</h1>
                        <p class="text-[#8e919e] leading-relaxed text-xs mb-12">${p.description}</p>
                        
                        <div class="fixed bottom-0 left-0 right-0 p-5 bg-[#1e1f23]/90 backdrop-blur-2xl border-t border-white/10 flex items-center justify-between z-50">
                            <div>
                                <p class="text-[10px] text-[#8e919e] uppercase font-bold tracking-wider">Total Price</p>
                                <span class="text-2xl font-bold text-white">$${p.price.toFixed(2)}</span>
                            </div>
                            <button onclick="actionCart(${p.id})" class="bg-[#004a77] text-[#c2e7ff] hover:bg-[#005c95] px-8 py-4 rounded-2xl font-medium text-xs shadow-xl active:scale-95 transition-all flex items-center gap-2">
                                <span class="material-symbols-rounded text-sm">shopping_bag</span> Add to Bag
                            </button>
                        </div>
                    </div>
                </div>`;

            gsap.from("#detail-img", { scale: 0.85, opacity: 0, duration: 0.4, ease: "power2.out" });
            gsap.from("#detail-card", { y: 30, opacity: 0, duration: 0.4, ease: "power2.out", delay: 0.1 });
        }
        loadDetail();
    </script>
</body>
</html>
