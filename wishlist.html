<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XeroidShop | Saved</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
    <link rel="stylesheet" href="styles.css"/>
</head>
<body class="p-5 pb-32 bg-[#121316] text-[#e3e2e6]">
    <div id="snackbar">
        <span class="material-symbols-rounded text-[#a8c7fa]" id="snackIcon">info</span>
        <span id="snackText" class="text-xs font-medium">Action performed</span>
    </div>

    <div class="max-w-md mx-auto">
        <div class="flex items-center gap-4 mb-6">
            <button onclick="location.href='index.html'" class="w-10 h-10 bg-[#1e1f23] rounded-full border border-white/10 flex items-center justify-center active:scale-90 transition-all">
                <span class="material-symbols-rounded">arrow_back</span>
            </button>
            <h1 class="text-lg font-bold">Saved Collection</h1>
        </div>
        
        <div id="wish-list" class="space-y-3"></div>
    </div>

    <script src="script.js"></script>
    <script>
        function render() {
            const box = document.getElementById('wish-list');
            if (wishlist.length === 0) {
                box.innerHTML = `<div class="text-center py-20 text-[#8e919e] font-medium text-xs">No saved items yet.</div>`;
            } else {
                box.innerHTML = wishlist.map(item => `
                    <div class="bg-[#1e1f23] p-3.5 rounded-2xl flex items-center gap-4 border border-white/5 relative">
                        <img src="${item.image}" class="w-14 h-14 object-contain p-2 bg-white rounded-xl">
                        <div class="flex-1 min-w-0">
                            <h3 class="font-medium text-white text-xs truncate">${item.title}</h3>
                            <p class="text-[#a8c7fa] font-bold text-sm mt-1">$${item.price.toFixed(2)}</p>
                        </div>
                        <button onclick="actionWish(${item.id})" class="text-[#f2b8b5] p-2 active:scale-90 transition-all">
                            <span class="material-symbols-rounded text-sm">bookmark_remove</span>
                        </button>
                    </div>
                `).join('');
                gsap.from("#wish-list > div", { opacity: 0, y: 15, duration: 0.25, stagger: 0.04 });
            }
        }
        render();
    </script>
</body>
</html>
