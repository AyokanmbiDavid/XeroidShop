<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XeroidShop | Discovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
    <link rel="stylesheet" href="styles.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap');
        body { font-family: 'Google Sans', sans-serif; background: #F8F9FF; color: #1A1C1E; }
        
        .m3-card { background: #FFFFFF; border-radius: 32px; transition: all 0.3s cubic-bezier(0.2, 0, 0, 1); border: 1px solid #E0E2EC; }
        .m3-card:hover { transform: translateY(-4px); box-shadow: 0 12px 24px -10px rgba(0,0,0,0.1); background: #F3F4F9; }
        
        .search-pill { background: #EEF0F6; border-radius: 100px; transition: all 0.2s; }
        .search-pill:focus-within { background: #FFFFFF; box-shadow: 0 0 0 2px #0061A4; }

        .m3-nav { background: rgba(243, 244, 249, 0.95); backdrop-filter: blur(12px); border-radius: 100px; border: 1px solid rgba(255,255,255,0.5); }
        .nav-item { border-radius: 24px; transition: 0.2s; position: relative; }
        .nav-item.active { background: #D1E4FF; color: #001D35; }

        #snackbar {
            visibility: hidden; min-width: 280px; background: #2F3033; color: #F1F0F4;
            text-align: center; border-radius: 16px; padding: 16px; position: fixed;
            z-index: 100; left: 50%; bottom: 120px; transform: translateX(-50%);
            display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        #snackbar.show { visibility: visible; animation: slideUp 0.4s forwards, fadeOut 0.4s 2.6s forwards; }
        @keyframes slideUp { from { bottom: 80px; opacity: 0; } to { bottom: 120px; opacity: 1; } }
        @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
    </style>
</head>
<body class="pb-36">

    <div id="snackbar">
        <span class="material-symbols-rounded text-blue-300" id="snackIcon">info</span>
        <span id="snackText">Action performed</span>
    </div>

    <header class="p-6 sticky top-0 bg-[#F8F9FF]/80 backdrop-blur-lg z-40">
        <div class="max-w-xl mx-auto space-y-4">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold tracking-tight text-[#001D35]">Xeroid<span class="text-[#0061A4]">Shop</span></h1>
                <button class="w-12 h-12 rounded-full bg-[#E1E2EC] flex items-center justify-center">
                    <span class="material-symbols-rounded">person</span>
                </button>
            </div>
            <div class="search-pill flex items-center px-5 py-4 gap-3">
                <span class="material-symbols-rounded text-slate-500">search</span>
                <input type="text" id="find" placeholder="Explore items..." class="bg-transparent w-full outline-none text-sm">
            </div>
        </div>
    </header>

    <main class="max-w-xl mx-auto p-4">
        <div id="main-grid" class="grid grid-cols-1 gap-6"></div>
        <div class="flex justify-center mt-10">
            <button id="load" class="bg-[#0061A4] text-white px-10 py-4 rounded-full font-bold shadow-lg active:scale-95 transition-all">Load More Intelligence</button>
        </div>
    </main>

    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-sm m3-dock p-3 flex justify-around items-end z-50">
    <a href="index.html" class="nav-link active flex flex-col items-center flex-1">
        <div class="icon-wrapper">
            <span class="material-symbols-rounded" style="font-variation-settings: 'FILL' 1">home</span>
        </div>
        <span class="nav-label">Home</span>
    </a>

    <a href="wishlist.html" class="nav-link flex flex-col items-center flex-1 text-slate-500">
        <div class="icon-wrapper relative">
            <span class="material-symbols-rounded">favorite</span>
            <span id="wishlist-count" class="absolute top-0 right-0 w-2 h-2 bg-red-500 rounded-full border-2 border-white hidden"></span>
        </div>
        <span class="nav-label">Saved</span>
    </a>

    <a href="cart.html" class="nav-link flex flex-col items-center flex-1 text-slate-500">
        <div class="icon-wrapper relative">
            <span class="material-symbols-rounded">shopping_bag</span>
            <span id="cart-count" class="absolute top-0 right-0 w-2 h-2 bg-[#0061A4] rounded-full border-2 border-white hidden"></span>
        </div>
        <span class="nav-label">Cart</span>
    </a>

    <a href="#" class="nav-link flex flex-col items-center flex-1 text-slate-500">
        <div class="icon-wrapper">
            <span class="material-symbols-rounded">person</span>
        </div>
        <span class="nav-label">Profile</span>
    </a>
</nav>


    <script src="script.js"></script>
    <script>
        let limit = 5;
        async function init() {
            const res = await fetch('https://fakestoreapi.com/products');
            allProducts = await res.json();
            render(allProducts.slice(0, limit));
        }

        function render(data) {
            document.getElementById('main-grid').innerHTML = data.map(p => {
                const isFav = wishlist.some(i => i.id == p.id);
                return `
                <div class="m3-card p-6 relative">
                    <button onclick="actionWish(${p.id})" class="absolute top-4 right-4 z-20 w-12 h-12 bg-white/80 backdrop-blur rounded-full flex items-center justify-center shadow-sm active:scale-90 transition-all">
                        <span class="material-symbols-rounded ${isFav ? 'text-red-500' : 'text-slate-300'}" style="font-variation-settings: 'FILL' ${isFav?1:0}">favorite</span>
                    </button>
                    <a href="product-detail.html?id=${p.id}" class="flex gap-6 items-center">
                        <div class="w-28 h-28 bg-white rounded-3xl p-3 flex-shrink-0">
                            <img src="${p.image}" class="w-full h-full object-contain">
                        </div>
                        <div class="flex-1">
                            <span class="text-[10px] font-bold text-[#0061A4] uppercase tracking-widest">${p.category}</span>
                            <h3 class="text-lg font-bold text-[#1A1C1E] line-clamp-1 mt-1">${p.title}</h3>
                            <p class="text-xl font-bold text-[#1A1C1E] mt-2">$${p.price}</p>
                        </div>
                    </a>
                    <div class="mt-6 flex gap-3">
                        <button onclick="actionCart(${p.id})" class="flex-1 bg-[#D1E4FF] text-[#001D35] py-4 rounded-2xl font-bold text-sm active:scale-95 transition-all">Add to Cart</button>
                    </div>
                </div>`;
            }).join('');
        }
        init();
    </script>
</body>
</html>
