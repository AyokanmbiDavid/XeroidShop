<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XeroidShop | Peak Google UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
    <link rel="stylesheet" href="styles.css"/>
</head>
<body class="pb-36 min-h-screen bg-[#121316] text-[#e3e2e6]">

    <div id="snackbar">
        <span class="material-symbols-rounded text-[#a8c7fa]" id="snackIcon">info</span>
        <span id="snackText" class="text-xs font-medium">Action performed</span>
    </div>

    <!-- Header / Google Search Top Bar -->
    <header class="p-5 sticky top-0 bg-[#121316]/90 backdrop-blur-xl z-40 border-b border-white/5 space-y-4">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-[#a8c7fa] animate-pulse"></span>
                <h1 class="text-xl font-bold tracking-tight text-white">Xeroid<span class="text-[#a8c7fa]">Shop</span></h1>
            </div>
            <button class="w-10 h-10 rounded-full bg-[#1e1f23] border border-white/10 flex items-center justify-center text-[#c4c6d0] active:scale-90 transition-all">
                <span class="material-symbols-rounded">account_circle</span>
            </button>
        </div>
        
        <!-- Search Pill -->
        <div class="max-w-md mx-auto m3-search-pill flex items-center px-4 py-3 gap-3">
            <span class="material-symbols-rounded text-[#8e919e]">search</span>
            <input type="text" id="find" placeholder="Search catalog..." class="bg-transparent w-full outline-none text-sm text-white font-medium placeholder-[#8e919e]">
        </div>

        <!-- M3 Filter Chips Scrollable -->
        <div class="max-w-md mx-auto flex gap-2 overflow-x-auto no-scrollbar pt-1" id="chips-bar">
            <button class="m3-chip active" onclick="filterCat('all', this)">All</button>
            <button class="m3-chip" onclick="filterCat('electronics', this)">Electronics</button>
            <button class="m3-chip" onclick="filterCat('jewelery', this)">Jewelry</button>
            <button class="m3-chip" onclick="filterCat('men\'s clothing', this)">Men</button>
            <button class="m3-chip" onclick="filterCat('women\'s clothing', this)">Women</button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <!-- Spotlight / Featured Hero Banner -->
        <div id="hero-banner"></div>

        <!-- Bento Grid Feed -->
        <div id="main-grid" class="grid grid-cols-2 gap-3.5"></div>

        <div class="flex justify-center pt-6">
            <button id="load" class="bg-[#004a77] text-[#c2e7ff] hover:bg-[#005c95] px-8 py-3.5 rounded-full font-medium text-xs border border-white/5 active:scale-95 transition-all">
                Explore More Items
            </button>
        </div>
    </main>

    <!-- Bottom Google Navigation Dock -->
    <nav class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-sm m3-dock p-2 flex justify-around items-center z-50">
        <a href="index.html" class="nav-link active flex flex-col items-center flex-1">
            <div class="icon-wrapper">
                <span class="material-symbols-rounded">explore</span>
            </div>
            <span class="nav-label text-[#c2e7ff]">Explore</span>
        </a>

        <a href="wishlist.html" class="nav-link flex flex-col items-center flex-1 text-[#8e919e]">
            <div class="icon-wrapper relative">
                <span class="material-symbols-rounded">bookmark</span>
                <span id="wishlist-count" class="absolute top-1 right-2 w-2.5 h-2.5 bg-[#f2b8b5] rounded-full hidden"></span>
            </div>
            <span class="nav-label">Saved</span>
        </a>

        <a href="cart.html" class="nav-link flex flex-col items-center flex-1 text-[#8e919e]">
            <div class="icon-wrapper relative">
                <span class="material-symbols-rounded">shopping_bag</span>
                <span id="cart-count" class="absolute top-1 right-2 w-2.5 h-2.5 bg-[#a8c7fa] rounded-full hidden"></span>
            </div>
            <span class="nav-label">Bag</span>
        </a>
    </nav>

    <script src="script.js"></script>
    <script>
        let limit = 8;
        let activeCategory = 'all';

        async function init() {
            const res = await fetch('https://fakestoreapi.com/products');
            allProducts = await res.json();
            renderHero(allProducts[0]);
            render(allProducts.slice(1, limit));
        }

        function renderHero(p) {
            if (!p) return;
            const isFav = wishlist.some(i => i.id == p.id);
            document.getElementById('hero-banner').innerHTML = `
                <div onclick="location.href='product-detail.html?id=${p.id}'" class="m3-bento-card p-5 cursor-pointer bg-gradient-to-br from-[#1e1f23] to-[#28292e]">
                    <div class="flex justify-between items-center mb-3">
                        <span class="bg-[#004a77] text-[#c2e7ff] text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider">Spotlight</span>
                        <button onclick="actionWish(${p.id}, event)" class="w-9 h-9 bg-[#121316]/60 rounded-full flex items-center justify-center border border-white/10 active:scale-90">
                            <span class="material-symbols-rounded ${isFav ? 'text-[#f2b8b5]' : 'text-[#8e919e]'}" style="font-variation-settings: 'FILL' ${isFav?1:0}">bookmark</span>
                        </button>
                    </div>
                    <div class="flex gap-4 items-center">
                        <div class="w-28 h-28 bg-white rounded-2xl p-3 flex-shrink-0 flex items-center justify-center shadow-inner">
                            <img src="${p.image}" class="max-h-full max-w-full object-contain">
                        </div>
                        <div class="flex-1 min-w-0">
                            <h2 class="text-sm font-bold text-white line-clamp-2 leading-snug">${p.title}</h2>
                            <p class="text-xs text-[#8e919e] mt-1 flex items-center gap-1 font-medium">
                                <span class="material-symbols-rounded text-amber-300 text-sm" style="font-variation-settings: 'FILL' 1">star</span> ${p.rating.rate}
                            </p>
                            <div class="mt-3 flex justify-between items-center">
                                <span class="text-base font-bold text-[#a8c7fa]">$${p.price.toFixed(2)}</span>
                                <button onclick="actionCart(${p.id}, event)" class="bg-[#a8c7fa] text-[#00315a] p-2 rounded-xl flex items-center justify-center font-bold active:scale-90">
                                    <span class="material-symbols-rounded text-sm">add_shopping_cart</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function render(data) {
            document.getElementById('main-grid').innerHTML = data.map(p => {
                const isFav = wishlist.some(i => i.id == p.id);
                return `
                <div onclick="location.href='product-detail.html?id=${p.id}'" class="m3-bento-card p-3.5 flex flex-col justify-between cursor-pointer">
                    <div>
                        <div class="relative bg-white rounded-2xl p-3 h-32 flex items-center justify-center mb-3">
                            <img src="${p.image}" class="max-h-full max-w-full object-contain">
                            <button onclick="actionWish(${p.id}, event)" class="absolute top-2 right-2 w-8 h-8 bg-[#121316]/70 rounded-full flex items-center justify-center border border-white/10 active:scale-90">
                                <span class="material-symbols-rounded text-sm ${isFav ? 'text-[#f2b8b5]' : 'text-[#8e919e]'}" style="font-variation-settings: 'FILL' ${isFav?1:0}">bookmark</span>
                            </button>
                        </div>
                        <span class="text-[9px] font-bold text-[#a8c7fa] uppercase tracking-wider block mb-1 truncate">${p.category}</span>
                        <h3 class="text-xs font-medium text-white line-clamp-2 leading-tight">${p.title}</h3>
                    </div>
                    
                    <div class="mt-3 flex items-center justify-between pt-2 border-t border-white/5">
                        <span class="text-sm font-bold text-[#e3e2e6]">$${p.price.toFixed(2)}</span>
                        <button onclick="actionCart(${p.id}, event)" class="w-8 h-8 bg-[#28292e] hover:bg-[#004a77] text-[#a8c7fa] hover:text-[#c2e7ff] rounded-xl flex items-center justify-center border border-white/5 active:scale-90 transition-all">
                            <span class="material-symbols-rounded text-sm">add</span>
                        </button>
                    </div>
                </div>`;
            }).join('');

            gsap.from(".m3-bento-card", { opacity: 0, y: 15, duration: 0.3, stagger: 0.04, ease: "power2.out" });
        }

        function filterCat(cat, el) {
            activeCategory = cat;
            document.querySelectorAll('.m3-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            
            let filtered = cat === 'all' ? allProducts : allProducts.filter(p => p.category.toLowerCase() === cat);
            render(filtered.slice(0, limit));
        }

        document.getElementById('find').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p => p.title.toLowerCase().includes(val) || p.category.toLowerCase().includes(val));
            render(filtered);
        });

        document.getElementById('load').addEventListener('click', () => {
            limit += 6;
            let currentList = activeCategory === 'all' ? allProducts : allProducts.filter(p => p.category.toLowerCase() === activeCategory);
            render(currentList.slice(0, limit));
        });

        init();
    </script>
</body>
</html>
