<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XeroidShop | Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.3); }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body>
    <header class="p-6 sticky top-0 glass z-50">
        <h1 class="text-2xl font-bold text-slate-900">XeroidShop</h1>
        <div class="relative mt-4">
            <input type="text" id="find" placeholder="Search premium items..." class="w-full p-4 pl-12 rounded-2xl border-none shadow-sm outline-none focus:ring-2 focus:ring-blue-500">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
        </div>
    </header>

    <main id="main-grid" class="p-6 grid grid-cols-1 sm:grid-cols-2 gap-8"></main>

    <div class="flex justify-center py-4">
        <button id="load" class="bg-white px-8 py-4 rounded-2xl shadow-sm font-bold border border-slate-100 active:scale-95 transition-all">Load More</button>
    </div>

    <section class="px-6 py-12 mb-24">
        <div class="bg-slate-900 p-6 sm:p-10 rounded-[2.5rem] text-center text-white shadow-2xl overflow-hidden relative">
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-600/20 blur-3xl"></div>
            
            <h2 class="text-xl sm:text-2xl font-bold mb-2">Join the Club</h2>
            <p class="text-slate-400 text-xs sm:text-sm mb-8 px-4">Subscribe for exclusive Xeroid drops and member-only deals.</p>
            
            <div class="flex flex-col sm:flex-row gap-3">
                <div class="flex-1 bg-white/10 border border-white/10 rounded-2xl flex items-center px-4 py-4 focus-within:border-blue-500 transition-all">
                    <i class="fa-regular fa-envelope text-slate-400 mr-3"></i>
                    <input type="email" placeholder="Your email address" class="bg-transparent w-full outline-none text-sm text-white placeholder:text-slate-500">
                </div>
                <button class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-4 rounded-2xl font-bold text-sm transition-all active:scale-95">
                    Subscribe
                </button>
            </div>
        </div>
    </section>

    <nav class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-slate-900/95 backdrop-blur-xl rounded-[2.5rem] px-8 py-5 flex justify-between items-center shadow-2xl z-50">
        <a href="index.html" class="text-blue-500"><i class="fa-solid fa-house text-xl"></i></a>
        <a href="wishlist.html" class="text-slate-400 relative">
            <i class="fa-solid fa-heart text-xl"></i>
            <span id="wishlist-count" class="absolute -top-2 -right-2 bg-red-500 text-[10px] w-4 h-4 rounded-full flex items-center justify-center text-white font-bold">0</span>
        </a>
        <a href="cart.html" class="text-slate-400 relative">
            <i class="fa-solid fa-cart-shopping text-xl"></i>
            <span id="cart-count" class="absolute -top-2 -right-2 bg-blue-500 text-[10px] w-4 h-4 rounded-full flex items-center justify-center text-white font-bold">0</span>
        </a>
        <a href="#" class="text-slate-400"><i class="fa-solid fa-user text-xl"></i></a>
    </nav>

    <script src="script.js"></script>
    <script>
        let limit = 6;
        async function init() {
            const res = await fetch('https://fakestoreapi.com/products');
            allProducts = await res.json();
            render(allProducts.slice(0, limit));
        }

        function render(data) {
            document.getElementById('main-grid').innerHTML = data.map(p => `
                <div class="bg-white rounded-[2.5rem] p-5 shadow-sm border border-slate-50 flex flex-col group relative">
                    <button onclick="actionWish(${p.id})" class="absolute top-4 right-4 z-20 w-10 h-10 glass rounded-full flex items-center justify-center shadow-md active:scale-90 transition-all">
                        <i class="fa-solid fa-heart ${wishlist.some(i=>i.id==p.id)?'text-red-500':'text-slate-300'}"></i>
                    </button>
                    <a href="product-detail.html?id=${p.id}" class="block">
                        <div class="aspect-square bg-slate-50 rounded-[2rem] p-8 mb-6 overflow-hidden">
                            <img src="${p.image}" class="w-full h-full object-contain mix-blend-multiply group-hover:scale-110 transition-transform duration-500">
                        </div>
                        <div class="px-2 pb-2">
                            <h3 class="font-bold text-slate-800 truncate mb-1">${p.title}</h3>
                            <p class="text-xl font-bold text-slate-900">$${p.price}</p>
                        </div>
                    </a>
                </div>
            `).join('');
        }

        document.getElementById('find').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allProducts.filter(p => p.title.toLowerCase().includes(term));
            render(filtered);
        });

        document.getElementById('load').addEventListener('click', () => {
            limit += 6;
            render(allProducts.slice(0, limit));
            if(limit >= allProducts.length) document.getElementById('load').style.display = 'none';
        });

        init();
    </script>
</body>
</html>
