<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XeroidShop | Cart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap');
        body { font-family: 'Google Sans', sans-serif; background: #F8F9FF; }
    </style>
</head>
<body class="p-6 pb-40">
    <div class="max-w-xl mx-auto">
        <div class="flex items-center gap-4 mb-8">
            <button onclick="location.href='index.html'" class="w-12 h-12 bg-white rounded-full shadow-sm flex items-center justify-center active:scale-90 transition-all">
                <span class="material-symbols-rounded">arrow_back</span>
            </button>
            <h1 class="text-2xl font-bold">Your Cart</h1>
        </div>

        <div id="cart-list" class="space-y-4"></div>
    </div>

    <div class="fixed bottom-8 left-1/2 -translate-x-1/2 w-[90%] max-w-sm bg-[#1A1C1E] p-6 rounded-[36px] text-white shadow-2xl z-50">
        <div class="flex justify-between items-center mb-6 px-2">
            <span class="text-slate-400 font-medium">Final Total</span>
            <span id="final-sum" class="text-3xl font-bold">$0.00</span>
        </div>
        <button onclick="location.href='checkout.html'" class="w-full bg-[#D1E4FF] text-[#001D35] py-5 rounded-[24px] font-bold text-lg active:scale-95 transition-all">
            Continue to Payment
        </button>
    </div>

    <script src="script.js"></script>
    <script>
        function draw() {
            let total = 0;
            const items = getStorage('xeroid_cart');
            document.getElementById('cart-list').innerHTML = items.map((p, idx) => {
                total += p.price;
                return `
                    <div class="bg-white p-5 rounded-[32px] flex items-center gap-5 shadow-sm border border-slate-100">
                        <img src="${p.image}" class="w-16 h-16 object-contain p-2 bg-slate-50 rounded-2xl">
                        <div class="flex-1 min-w-0">
                            <h3 class="font-bold text-sm truncate text-[#1A1C1E]">${p.title}</h3>
                            <p class="text-[#0061A4] font-bold">$${p.price}</p>
                        </div>
                        <button onclick="let c=getStorage('xeroid_cart'); c.splice(${idx},1); setStorage('xeroid_cart',c); location.reload();" class="text-slate-300 hover:text-red-500 transition-colors">
                            <span class="material-symbols-rounded">delete</span>
                        </button>
                    </div>`;
            }).join('');
            document.getElementById('final-sum').innerText = `$${total.toFixed(2)}`;
            localStorage.setItem('xeroid_total', total.toFixed(2));
        }
        draw();
    </script>
</body>
</html>
