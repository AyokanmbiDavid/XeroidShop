<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XeroidShop | Payment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap');
        body { font-family: 'Google Sans', sans-serif; background: #FFFFFF; }
    </style>
</head>
<body class="p-8 flex flex-col items-center justify-center min-h-screen">
    <div class="w-full max-w-sm text-center">
        <div class="w-20 h-20 bg-[#D1E4FF] text-[#001D35] rounded-full flex items-center justify-center mx-auto mb-8">
            <span class="material-symbols-rounded" style="font-size: 40px;">contactless_off</span>
        </div>
        <h1 class="text-3xl font-bold mb-4 text-[#1A1C1E]">Checkout</h1>
        <p class="text-slate-500 mb-10 px-6">Review your order before we finalize the premium delivery.</p>
        
        <div class="bg-[#F8F9FF] p-8 rounded-[40px] mb-10 border border-slate-100">
            <p class="text-slate-400 text-xs font-bold uppercase tracking-widest mb-2">Total amount due</p>
            <p id="bill" class="text-5xl font-bold text-[#1A1C1E] tracking-tight">$0.00</p>
        </div>

        <div class="space-y-4">
            <button onclick="alert('Success! Items are on the way.'); localStorage.removeItem('xeroid_cart'); location.href='index.html'" class="w-full bg-[#1A1C1E] text-white py-6 rounded-[28px] font-bold text-xl shadow-xl active:scale-95 transition-all">
                Confirm & Pay
            </button>
            <button onclick="history.back()" class="w-full py-4 text-slate-400 font-bold text-sm">
                Cancel Transaction
            </button>
        </div>
    </div>
    <script>
        // Ensure we pull the specific key set in cart.html
        document.getElementById('bill').innerText = `$${localStorage.getItem('xeroid_total') || '0.00'}`;
    </script>
</body>
</html>
