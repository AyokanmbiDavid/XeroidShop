<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XeroidShop | Checkout</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0" />
    <link rel="stylesheet" href="styles.css"/>
</head>
<body class="p-5 pb-32 min-h-screen bg-[#121316] text-[#e3e2e6] flex flex-col justify-between">

    <div id="snackbar">
        <span class="material-symbols-rounded text-[#a8c7fa]" id="snackIcon">info</span>
        <span id="snackText" class="text-xs font-medium">Action performed</span>
    </div>

    <main class="max-w-md mx-auto w-full space-y-6">
        <!-- Top App Bar -->
        <div class="flex items-center gap-4 py-2">
            <button onclick="history.back()" class="w-10 h-10 bg-[#1e1f23] rounded-full border border-white/10 flex items-center justify-center active:scale-90 transition-all">
                <span class="material-symbols-rounded text-white">arrow_back</span>
            </button>
            <h1 class="text-lg font-bold">Review & Pay</h1>
        </div>

        <!-- Google Pay / Payment Header Card -->
        <div id="checkout-hero" class="m3-bento-card p-6 text-center bg-gradient-to-br from-[#1e1f23] to-[#28292e]">
            <div class="w-16 h-16 bg-[#004a77] text-[#c2e7ff] border border-white/10 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                <span class="material-symbols-rounded" style="font-size: 32px;">lock</span>
            </div>
            <p class="text-[10px] font-bold uppercase tracking-widest text-[#a8c7fa] mb-1">Encrypted Payment</p>
            <h2 class="text-xl font-bold text-white mb-1">Xeroid Express Checkout</h2>
            <p class="text-[#8e919e] text-xs">Fast and secure transaction via Google Pay or Card</p>
        </div>

        <!-- Order Summary Breakdown -->
        <div id="summary-card" class="bg-[#1e1f23] p-5 rounded-[28px] border border-white/5 space-y-4">
            <h3 class="text-xs font-bold uppercase tracking-wider text-[#a8c7fa] flex items-center gap-2">
                <span class="material-symbols-rounded text-sm">receipt_long</span> Order Summary
            </h3>
            
            <div id="items-preview" class="space-y-2 max-h-36 overflow-y-auto pr-1"></div>

            <div class="pt-3 border-t border-white/5 space-y-2 text-xs">
                <div class="flex justify-between text-[#8e919e]">
                    <span>Subtotal</span>
                    <span id="subtotal-val">$0.00</span>
                </div>
                <div class="flex justify-between text-[#8e919e]">
                    <span>Delivery Fee</span>
                    <span class="text-[#a8c7fa] font-medium">FREE</span>
                </div>
                <div class="flex justify-between text-sm font-bold text-white pt-2 border-t border-white/5">
                    <span>Total Amount</span>
                    <span id="bill" class="text-[#a8c7fa] text-base">$0.00</span>
                </div>
            </div>
        </div>

        <!-- Delivery Address Preview -->
        <div class="bg-[#1e1f23] p-4 rounded-2xl border border-white/5 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 rounded-xl bg-[#28292e] flex items-center justify-center text-[#a8c7fa]">
                    <span class="material-symbols-rounded text-sm">location_on</span>
                </div>
                <div>
                    <p class="text-xs font-bold text-white">Default Address</p>
                    <p class="text-[10px] text-[#8e919e]">Lagos, Nigeria</p>
                </div>
            </div>
            <button class="text-[#a8c7fa] text-xs font-medium px-2 py-1 hover:underline">Change</button>
        </div>
    </main>

    <!-- Bottom Action Dock -->
    <div class="max-w-md mx-auto w-full pt-6">
        <button onclick="processPayment()" class="w-full bg-[#004a77] text-[#c2e7ff] hover:bg-[#005c95] py-4 rounded-2xl font-bold text-sm shadow-xl active:scale-95 transition-all flex items-center justify-center gap-2">
            <span class="material-symbols-rounded text-sm">check_circle</span> Complete Purchase
        </button>
        <button onclick="history.back()" class="w-full py-3 text-[#8e919e] font-medium text-xs text-center block mt-2 hover:text-white transition-colors">
            Cancel and Return
        </button>
    </div>

    <script src="script.js"></script>
    <script>
        function loadCheckout() {
            const items = getStorage('xeroid_cart');
            const preview = document.getElementById('items-preview');
            let total = 0;

            if (items.length === 0) {
                preview.innerHTML = `<p class="text-xs text-[#8e919e]">No items found in cart.</p>`;
            } else {
                preview.innerHTML = items.map(item => {
                    total += item.price;
                    return `
                        <div class="flex justify-between items-center text-xs py-1">
                            <span class="text-[#c4c6d0] truncate max-w-[200px]">${item.title}</span>
                            <span class="font-bold text-white">$${item.price.toFixed(2)}</span>
                        </div>
                    `;
                }).join('');
            }

            const totalFormatted = `$${total.toFixed(2)}`;
            document.getElementById('subtotal-val').innerText = totalFormatted;
            document.getElementById('bill').innerText = totalFormatted;

            gsap.from("#checkout-hero", { opacity: 0, y: 15, duration: 0.35, ease: "power2.out" });
            gsap.from("#summary-card", { opacity: 0, y: 20, duration: 0.35, delay: 0.08, ease: "power2.out" });
        }

        function processPayment() {
            showToast("Order placed successfully!", "task_alt");
            localStorage.removeItem('xeroid_cart');
            setTimeout(() => {
                location.href = 'index.html';
            }, 1500);
        }

        loadCheckout();
    </script>
</body>
</html>
